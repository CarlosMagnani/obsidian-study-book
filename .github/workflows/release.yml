name: Release

# A tag precisa ser exatamente igual ao "version" do manifest.json, sem "v".
# Exemplo: 0.1.0
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check that the tag matches the manifest
        run: |
          version=$(node -p "require('./manifest.json').version")
          tag="${GITHUB_REF_NAME}"
          if [ "$version" != "$tag" ]; then
            echo "The tag ($tag) must match the manifest version ($version)."
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "Automated release of Study Book." \
            main.js manifest.json styles.css
